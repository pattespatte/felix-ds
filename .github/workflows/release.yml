name: Release to GitHub Packages

# Triggered by the owner pushing a vX.Y.Z tag, as described in
# docs/release.en.md. Builds, type-checks and runs the visual release gate
# (against linux baselines) before publishing the package and creating the
# GitHub Release.

on:
  push:
    tags: ["v*"]

permissions:
  # contents:write is required by the `gh release create` step at the end.
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Parity gate: the committed DTCG token files must match the
      # SCSS sources; a stale tokens/*.json fails the release here.
      - run: bun test
      - run: bun run build
      - run: bunx vue-tsc --noEmit
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:visual
      - name: Upload gate report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-gate-failure
          path: |
            test-results
            playwright-report
          retention-days: 14
      - name: Authenticate npm client against GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
      # npm, not bun: bun 1.4.x does not pick up registry auth from ~/.npmrc
      # for GitHub Packages ("missing authentication"); npm reads it fine.
      - run: npm publish
      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
