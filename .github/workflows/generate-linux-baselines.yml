name: Generate linux visual baselines

# Manual helper for the release runbook: regenerates the -linux.png visual
# baselines on an ubuntu runner and uploads them as an artifact. The owner
# downloads the artifact, copies the *-linux.png files into
# e2e/visual.spec.ts-snapshots/ and commits them (docs/release.en.md,
# preconditions, step 5). Never runs automatically; publishes nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test visual.spec.ts --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: linux-baselines
          path: e2e/visual.spec.ts-snapshots
          retention-days: 7
