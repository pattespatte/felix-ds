# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# Conventional commits in, Keep a Changelog out.
# Regenerate with: bun run changelog   (bunx git-cliff -o CHANGELOG.md)

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file. The format
is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and the
file is generated by [git-cliff](https://git-cliff.org) from the repository's
conventional commits.
"""
# Rendered once per release (git-cliff 2.x template model): `version`,
# `timestamp` and `commits` are in scope; `version` is empty for unreleased
# commits at the top.
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] – {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                /compare/{{ release.previous.version }}..{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                /tree/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
            /compare/{{ release.previous.version }}..HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
trim = true

[git]
# Parse commits according to the conventional commits specification.
conventional_commits = true
# Keep commits that do not match the spec (they land in the fallback group).
filter_unconventional = false
# Regex parsers mapping commit types to Keep a Changelog sections.
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^ci", group = "CI" },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^revert", group = "Reverted" },
    { message = ".*", group = "Changed" },
]
filter_commits = false
topo_order = false
sort_commits = "oldest"
# Only vX.Y.Z tags cut releases; everything since the last tag stays
# under [Unreleased] until the runbook's changelog step is run.
tag_pattern = "v[0-9].*"
